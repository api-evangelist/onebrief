aid: onebrief
name: Onebrief
description: >-
  Onebrief is a defense-technology company building a unified command workspace
  for military planning, decision-making, and staff collaboration. The web-based
  platform centralizes live, synchronized operational data into reusable "Cards"
  that produce C2 charts, maps, timelines, presentations, documents, and
  whiteboards from live data rather than static content, with doctrine-aware AI
  assistance (built on Anthropic Claude) that anticipates dependencies and
  surfaces critical information early. In August 2024 Onebrief launched a
  policy-aware, versioned API that accepts data in common DoD formats and connects
  key mission systems such as Maven Smart System and Advana into a live, shared
  mission picture, supporting bidirectional data flow across classified and
  unclassified networks (SIPR, NIPR, JWICS) in alignment with JADC2 data
  interoperability goals. Backed by Battery Ventures, General Catalyst, Insight
  Partners, and Sapphire Ventures. The API is a government-deployed product with
  no public developer portal, specification, or self-serve base URL.
